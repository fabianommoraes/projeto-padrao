<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f1;--card:#fff;--tx:#15211b;--mut:#5d6a63;--bd:#dde3de;--ac:#2f5bea;--acx:#fff;--up:#e8590c;--ok:#1b7f4b;--inp:#f6f8f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1317;--card:#1a2027;--tx:#e8ecef;--mut:#9aa6af;--bd:#2a323a;--ac:#7c9bff;--acx:#0f1317;--up:#ff9a5c;--ok:#5fd596;--inp:#12171c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1317;--card:#1a2027;--tx:#e8ecef;--mut:#9aa6af;--bd:#2a323a;--ac:#7c9bff;--acx:#0f1317;--up:#ff9a5c;--ok:#5fd596;--inp:#12171c;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:400 16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 14px}
h1{font:700 30px/1.1 "Barlow Condensed",Barlow,sans-serif;margin:4px 0 12px;letter-spacing:.2px}
h2{font:700 20px/1.2 "Barlow Condensed",Barlow,sans-serif;margin:18px 0 8px}
p{margin:6px 0}.mut{color:var(--mut);font-size:14px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.chip{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:9px 4px;font:600 15px/1.2 Barlow,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px}
.chip small{font-weight:400;font-size:12px;color:var(--mut)}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--acx)}.chip.on small{color:var(--acx);opacity:.85}
.wk{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.wk b{font:700 20px "Barlow Condensed",sans-serif}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden}
summary{list-style:none;padding:13px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary b{font-weight:600}
summary span{font:700 20px "Barlow Condensed",sans-serif;text-align:right}
summary em{grid-column:1/3;font-style:normal;font-size:13px;color:var(--mut)}
details[open] summary{border-bottom:1px solid var(--bd)}
.body{padding:12px 14px 14px}
label{display:block;font-size:13px;color:var(--mut)}
input{width:100%;margin-top:3px;padding:11px 10px;font:600 18px Barlow,sans-serif;color:var(--tx);background:var(--inp);border:1.5px solid var(--bd);border-radius:10px}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.reps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.sug{min-height:22px;font-weight:600;margin:10px 0 0}.sug.up{color:var(--up)}.sug.keep{color:var(--ok)}
.save{width:100%;margin-top:8px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font:600 16px Barlow,sans-serif}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.wkc{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;color:var(--tx);font:400 15px/1.35 Barlow,sans-serif}
.wkc.on{border-color:var(--ac);box-shadow:inset 0 0 0 1.5px var(--ac)}
.wkc i{font:700 28px "Barlow Condensed",sans-serif;font-style:normal;text-align:center}
.wkc u{text-decoration:none;font:700 18px "Barlow Condensed",sans-serif;white-space:nowrap}
.pg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px;text-align:center}
.pg div{background:var(--inp);border-radius:10px;padding:6px 2px}.pg b{display:block;font:700 20px "Barlow Condensed",sans-serif}.pg small{color:var(--mut);font-size:12px}
.pos{color:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:13px 4px;font:600 15px Barlow,sans-serif}
nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav><button data-tab="0">Treino</button><button data-tab="1">Ciclo</button><button data-tab="2">Progresso</button></nav>
<script>
const PLAN=[
{n:"Superior A",d:"Segunda",e:[["Supino reto na máquina",3,6,10],["Puxada alta",3,8,12],["Desenvolvimento de ombros na máquina",3,8,12],["Remada baixa com triângulo",3,8,12],["Elevação lateral na polia",4,12,15],["Tríceps na polia com barra",3,10,12],["Rosca Scott na máquina",3,10,12]]},
{n:"Inferior A",d:"Terça",e:[["Leg press 90°",4,8,12],["Mesa flexora",3,10,12],["Cadeira extensora",3,10,15],["Gêmeos sentado",3,10,15],["Elevação lateral na polia",4,12,15],["Crucifixo inverso (peck deck reverso)",3,12,15]]},
{n:"Superior B",d:"Quarta",e:[["Remada cavalinho",4,8,10],["Supino inclinado na máquina",3,8,12],["Crucifixo (peck deck)",3,10,15],["Tríceps acima da cabeça na polia",3,10,12],["Rosca direta na polia baixa",3,10,12]]},
{n:"Inferior B",d:"Quinta",e:[["Stiff / terra romeno",3,8,10],["Leg press (pés mais altos)",3,10,12],["Cadeira flexora",3,10,15],["Cadeira extensora",2,12,15],["Gêmeos sentado",3,10,15]]}];
const CICLO=[
["Calibração: ache a carga de cada exercício e anote. Exercícios novos começam leves; pernas com 1 série a menos.","3"],
["Mesma carga, busque +1-2 repetições por série.","2-3"],
["Quem atingir o topo da faixa em todas as séries sobe a carga.","2"],
["Continue a dupla progressão; pernas já no volume total.","1-2"],
["Continue a dupla progressão.","1-2"],
["Última série dos compostos mais perto da falha; isoladores com 0-1.","1"],
["Semana de pico: tente bater recordes de carga ou repetições.","1"],
["Descarga (opcional): mesmas cargas, metade das séries, longe da falha.","3-4"]];
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const app=document.getElementById("app");
const wd=new Date().getDay();
let tab=0,day=S.get("day",wd>=1&&wd<=4?wd-1:0),week=S.get("week",1),logs=S.get("logs",{}),open="";
const hoje=()=>new Date().toLocaleDateString("pt-BR");
const sug=(s,b,r)=>r.length>=s&&Math.min(...r)>=b?["up","Subir carga no próximo treino"]:["keep","Manter carga"];
function vTreino(){
 const P=PLAN[day];
 let h=`<h1>${P.n}</h1><div class="chips">${PLAN.map((p,i)=>`<button class="chip ${i==day?"on":""}" data-day="${i}">${p.d.slice(0,3)}<small>${p.n}</small></button>`).join("")}</div>`;
 h+=`<div class="wk"><span>Semana <b>${week}</b></span><span class="mut">RIR alvo <b style="color:var(--tx)">${CICLO[week-1][1]}</b></span></div>`;
 P.e.forEach((x,i)=>{
  const k=P.n+"|"+(i+1),L=logs[k]||[],l=L[L.length-1];
  h+=`<details data-k="${k}" data-s="${x[1]}" data-b="${x[3]}" ${open==k?"open":""}><summary><b>${i+1}. ${x[0]}</b><span>${x[1]}×${x[2]}-${x[3]}</span>${l?`<em>Último: ${l.d} · ${l.l} kg × ${l.r.join("/")}</em>`:`<em>Sem registro ainda</em>`}</summary>
  <div class="body"><label>Carga (kg)<input class="ld" type="number" inputmode="decimal" step="0.5" min="0" value="${l?l.l:""}"></label>
  <div class="reps">${Array.from({length:x[1]},(_,j)=>`<label>Série ${j+1}<input class="rp" type="number" inputmode="numeric" min="0" placeholder="${x[3]}"></label>`).join("")}</div>
  <p class="sug"></p><button class="save">Salvar registro</button></div></details>`;
 });
 return h+`<p class="mut">Seus registros ficam salvos neste aparelho.</p>`;
}
function vCiclo(){
 return `<h1>Ciclo de 8 semanas</h1><p class="mut">Toque numa semana para marcá-la como a atual. RIR é quantas repetições ainda sobrariam no fim da série.</p>`+
 CICLO.map((c,i)=>`<button class="card wkc ${i+1==week?"on":""}" data-wk="${i+1}"><i>${i+1}</i><span>${c[0]}</span><u>RIR ${c[1]}</u></button>`).join("")+
 `<h2>Como subir a carga</h2><div class="card"><p>Mantenha a carga e busque mais repetições. Quando completar o topo da faixa em todas as séries, com boa técnica, suba a carga (2-5% nos braços e ombros, 5-10% nas pernas) e volte ao piso da faixa.</p><p class="mut">Descanse 2-3 min nos compostos e 1-2 min nos isoladores.</p></div>`;
}
function vProg(){
 let h=`<h1>Progresso</h1>`,n=0;
 PLAN.forEach(P=>P.e.forEach((x,i)=>{
  const L=logs[P.n+"|"+(i+1)];if(!L||!L.length)return;n++;
  const a=L[0].l,z=L[L.length-1].l,m=Math.max(...L.map(r=>r.l)),dv=z-a;
  h+=`<div class="card"><b>${x[0]}</b><div class="mut">${P.n} · ${L.length} registro${L.length>1?"s":""}</div><div class="pg"><div><small>Inicial</small><b>${a}</b></div><div><small>Atual</small><b>${z}</b></div><div><small>Máxima</small><b>${m}</b></div></div><p class="mut">Variação: <span class="${dv>0?"pos":""}">${dv>0?"+":""}${dv} kg</span></p></div>`;
 }));
 return h+(n?"":`<p>Nenhum registro ainda. Abra a aba Treino, escolha um exercício e salve a carga e as repetições.</p>`);
}
function render(){
 app.innerHTML=[vTreino,vCiclo,vProg][tab]();
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",+b.dataset.tab===tab));
}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.tab!==undefined){tab=+t.dataset.tab;render();scrollTo(0,0)}
 else if(t.dataset.day!==undefined){day=+t.dataset.day;S.set("day",day);open="";render()}
 else if(t.dataset.wk){week=+t.dataset.wk;S.set("week",week);render()}
 else if(t.classList.contains("save")){
  const d=t.closest("details"),l=parseFloat(d.querySelector(".ld").value);
  const r=[...d.querySelectorAll(".rp")].map(i=>parseInt(i.value)).filter(v=>!isNaN(v));
  const s=d.querySelector(".sug");
  if(isNaN(l)||!r.length){s.className="sug";s.textContent="Digite a carga e pelo menos uma série.";return}
  (logs[d.dataset.k]=logs[d.dataset.k]||[]).push({d:hoje(),l,r});
  S.set("logs",logs);open=d.dataset.k;render();
 }
});
document.addEventListener("input",e=>{
 const d=e.target.closest("details");if(!d||!e.target.classList.contains("rp"))return;
 const r=[...d.querySelectorAll(".rp")].map(i=>parseInt(i.value)).filter(v=>!isNaN(v));
 const s=d.querySelector(".sug");
 if(!r.length){s.className="sug";s.textContent="";return}
 const [c,m]=sug(+d.dataset.s,+d.dataset.b,r);s.className="sug "+c;s.textContent=m;
});
render();
</script>
</body>
</html>
